[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gainlab-ai-trading-api"
version = "0.1.0"
description = "GainLab AI trading decision API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "PyMySQL>=1.1,<2",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
